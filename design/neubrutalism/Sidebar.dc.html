<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Neubrutalism sidebar</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@700&display=swap">
  <style>
body { margin: 0; }
  </style>
</helmet>
<div style="width: 250px; box-sizing: border-box; padding: 18px 16px 28px; display: flex; flex-direction: column; gap: 8px; font-family: 'Space Grotesk', system-ui, sans-serif; color: #111">
  <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 14px; background: #FFD43B; border: 3px solid #111; border-radius: 16px; box-shadow: 5px 5px 0 #111; transform: rotate(-1.5deg)">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12v4a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM16 11h2a2.5 2.5 0 0 1 0 5h-2M8 3v3M12 3v3"></path></svg>
    <span style="font-weight: 700; font-size: 18px; line-height: 1; letter-spacing: -0.02em">chai coffee<br>fund</span>
  </div>
  <sc-for list="{{items}}" as="it" hint-placeholder-count="13">
    <a href="{{it.href}}" style="{{it.style}}">
      <span style="{{it.chip}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg></span>
      <span>{{it.label}}</span>
    </a>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"overview"},"$preview":{"width":250,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const nav = [
      ['overview', 'Overview', 'Main.dc.html', '#FFD43B', 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2'],
      ['accounts', 'Accounts', 'NbAccounts.dc.html', '#FF8FB1', 'M3 10l9-6l9 6M5 10v8M10 10v8M14 10v8M19 10v8M3 20h18'],
      ['cards', 'Cards', 'NbCards.dc.html', '#7FD4FF', 'M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM2 10h20M6 15h4'],
      ['subscriptions', 'Subscriptions', 'NbSubscriptions.dc.html', '#B79CFF', 'M20 12a8 8 0 1 1-3-6.2M20 4v5h-5'],
      ['income', 'Income', 'NbIncome.dc.html', '#C6F24E', 'M12 3v14M6 11l6 6l6-6M4 21h16'],
      ['expenses', 'Expenses', 'NbExpenses.dc.html', '#FF9F3C', 'M12 21V7M6 13l6-6l6 6M4 3h16'],
      ['daily', 'Daily', 'NbDaily.dc.html', '#FFE066', 'M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM3 10h18M8 3v4M16 3v4'],
      ['loans', 'Loans', 'NbLoans.dc.html', '#FF6B57', 'M3 11l9-8l9 8M5 10v10h14V10M10 20v-6h4v6'],
      ['lent', 'Lent out', 'NbLent.dc.html', '#FFC46B', 'M9 3h6l-1 4h-4zM8 8c-3 3-4 6-4 9a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4c0-3-1-6-4-9'],
      ['insurance', 'Insurance', 'NbInsurance.dc.html', '#3FD6A6', 'M12 3l8 3v6c0 5-3.5 8-8 9c-4.500-1-8-4-8-9V6z'],
      ['fixed', 'Fixed Income', 'NbFixedIncome.dc.html', '#6FE0C5', 'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM12 8.500a3.500 3.500 0 1 0 0 7a3.500 3.500 0 1 0 0-7zM12 5v2'],
      ['investments', 'Investments', 'NbInvestments.dc.html', '#9FB0FF', 'M3 17l6-6l4 4l8-9M15 6h6v6'],
      ['goals', 'Goals', 'NbGoals.dc.html', '#FFA3D7', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z'],
    ];
    const items = nav.map(([key, label, href, color, d]) => {
      const on = key === active;
      return {
        label, href, d,
        style: 'display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:14px;text-decoration:none;font-weight:700;font-size:15px;border:3px solid ' + (on ? '#111' : 'transparent') + ';background:' + (on ? '#111' : 'transparent') + ';color:' + (on ? '#fff' : '#111') + ';box-shadow:' + (on ? '5px 5px 0 ' + color : 'none'),
        chip: 'flex:0 0 32px;height:32px;border:3px solid #111;border-radius:10px;display:flex;align-items:center;justify-content:center;background:' + color,
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
